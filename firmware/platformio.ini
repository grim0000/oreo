; Oreo firmware - build with PlatformIO (VS Code extension or the `pio` command line).
;
;   pio run -e oreo                 build
;   pio run -e oreo -t upload       build + flash over USB (the board's USB port, see docs/HANDBOOK.md)
;   pio run -e oreo -t uploadfs     (not used - web pages are built into the firmware)
;
; Wireless update once Oreo is on your WiFi (set ROBOT_IP first):
;   Windows PowerShell:  $env:ROBOT_IP="192.168.x.y"; pio run -e oreo_ota -t upload
;   macOS / Linux:       ROBOT_IP=192.168.x.y pio run -e oreo_ota -t upload
;
; The firmware is built with Arduino 2.0.17 as an ESP-IDF 4.4.7 component (bigger network buffers for the voice
; chat and video, PSRAM stacks). The first build downloads the toolchains and takes a while (~10 min).

[platformio]
default_envs = oreo

[env:oreo]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino, espidf
platform_packages =
	framework-arduinoespressif32 @ ~3.20017.0
	framework-espidf @ 3.40407.240606
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions_ota5.csv  ; two 5 MB app slots (wireless updates, face recognition models)
build_flags =
	-DBOARD_HAS_PSRAM
	-mfix-esp32-psram-cache-issue
	-Wno-error=format-truncation
	-Wno-format-truncation
build_unflags = -Werror=format-truncation -Werror=all
lib_deps =
	adafruit/Adafruit PWM Servo Driver Library @ ^3.0.1
	adafruit/Adafruit SSD1306 @ ^2.5.7
	adafruit/Adafruit GFX Library @ ^1.11.5
	lovyan03/LovyanGFX@^1.1.12
	adafruit/Adafruit_VL53L0X @ ^1.2.4

[env:oreo_ota]
extends = env:oreo
upload_protocol = custom
upload_command = curl -s -S -m 300 -X POST --data-binary @$SOURCE http://${sysenv.ROBOT_IP}/ota
