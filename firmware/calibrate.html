<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oreo Servo Calibrator</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #ffffff; padding: 20px; }
        h1 { text-align: center; color: #f2f2f2; }
        .controls { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; align-items: center; }
        input[type="text"] { padding: 10px; border-radius: 5px; border: 1px solid #555; background: #222; color: white; }
        button { background-color: #333; color: white; border: 1px solid #555; padding: 10px 15px; cursor: pointer; border-radius: 5px; font-weight: bold; }
        button:hover { background-color: #555; }
        .btn-connect { background-color: #28a745; }
        .btn-connect:hover { background-color: #218838; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: #1e1e1e; box-shadow: 0 4px 6px rgba(0,0,0,0.3); border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px; text-align: center; border-bottom: 1px solid #333; }
        th { background-color: #222; color: #f2f2f2; }
        .angle-display { font-size: 1.2em; font-weight: bold; width: 50px; display: inline-block; }
        .btn-jog { width: 50px; }
        .btn-capture { background-color: #007bff; }
        .btn-capture:hover { background-color: #0056b3; }
        .captured-val { width: 64px; background: #222; color: #00ffaa; font-weight: bold; border: 1px solid #555; border-radius: 4px; padding: 4px; text-align: center; margin-top: 4px; }
        .captured-val.dirty { color: #ff9f43; border-color: #ff9f43; }
        .row-active { background-color: #2a2a2a; }
        #status { text-align: center; margin-bottom: 20px; font-size: 1.1em; color: #ffaa00; }
        .export-container { display: flex; justify-content: center; margin-top: 20px; gap: 20px; align-items: center; }
        .btn-export { background-color: #6f42c1; font-size: 1.1em; padding: 15px 30px; }
        .btn-export:hover { background-color: #5a32a3; }
        .btn-sweep-all { background-color: #ff9800; font-size: 1.1em; padding: 15px 30px; color: black; }
        .btn-sweep-all:hover { background-color: #e68a00; }
        .speed-slider { display: flex; flex-direction: column; align-items: center; }
        .sweep-checkbox { transform: scale(1.5); cursor: pointer; }
    </style>
</head>
<body>

    <div style="max-width:100%;margin-bottom:6px"><a href="/" style="display:inline-block;background:#333;color:#fff;text-decoration:none;padding:10px 16px;border-radius:6px;border:1px solid #555;font-weight:bold">← Back to controller</a></div>
    <h1>🍪 Oreo Servo Calibrator</h1>
    
    <div class="controls">
        <label>ESP32 IP: </label>
        <input type="text" id="ipAddress" value="" placeholder="192.168.X.X">
        <button class="btn-connect" id="btnTest">Test Connection</button>
        <span id="status">Waiting...</span>
    </div>

    <table id="servoTable">
        <thead>
            <tr>
                <th>Servo</th>
                <th>Pin</th>
                <th>Sweep</th>
                <th>Controls</th>
                <th>Capture Min</th>
                <th>Capture Mid</th>
                <th>Capture Max</th>
            </tr>
        </thead>
        <tbody>
            <!-- Generated by JS -->
        </tbody>
    </table>
    
    <div class="export-container">
        <div class="speed-slider">
            <label>Sweep Speed: <span id="speedDisplay">20</span>ms</label>
            <input type="range" id="sweepSpeed" min="5" max="100" value="20">
        </div>
        <button class="btn-sweep-all" id="btnSweepAll">🌊 Toggle Sweep All</button>
        <button class="btn-sweep-all" style="background:#17a2b8" onclick="setAll('mid')">Set All Mid</button>
        <button class="btn-sweep-all" style="background:#dc3545" onclick="setAll('min')">Set All Min</button>
        <button class="btn-sweep-all" style="background:#28a745" onclick="setAll('max')">Set All Max</button>
        <button class="btn-export" id="btnExport">💾 Export Configuration</button>
        <button class="btn-export" id="btnSaveRobot" style="background:#e67e22">⬆ Save to robot</button>
        <button class="btn-export" id="btnResetRobot" style="background:#555">↺ Reset to built-in</button>
    </div>

<script>
    // (the channels are the reference wiring; the robot's servo map (/servomap) replaces them on load)
    const servos = [
        { name: "Pan (Head L/R)", role: "PAN", pin: 7 },
        { name: "Tilt (Head U/D)", role: "TILT", pin: 5 },
        { name: "L1 (Front L Shoulder)", role: "L1", pin: 12 },
        { name: "L2 (Back L Shoulder)", role: "L2", pin: 13 },
        { name: "L3 (Front L Knee)", role: "L3", pin: 11 },
        { name: "L4 (Back L Knee)", role: "L4", pin: 10 },
        { name: "R1 (Front R Shoulder)", role: "R1", pin: 14 },
        { name: "R2 (Back R Shoulder)", role: "R2", pin: 4 },
        { name: "R3 (Front R Knee)", role: "R3", pin: 9 },
        { name: "R4 (Back R Knee)", role: "R4", pin: 8 }
    ];

    const state = {};
    let sweepInterval = null;

    function saveState() {
        localStorage.setItem('sesame_servo_state', JSON.stringify(state));
    }

    function loadState() {
        const saved = localStorage.getItem('sesame_servo_state');
        if (saved) {
            try {
                const parsed = JSON.parse(saved);
                for (const pin in parsed) {
                    if (state[pin]) {
                        state[pin].min = parsed[pin].min;
                        state[pin].mid = parsed[pin].mid;
                        state[pin].max = parsed[pin].max;
                        state[pin].current = parsed[pin].current !== undefined ? parsed[pin].current : 90;
                    }
                }
            } catch (e) {
                console.error("Failed to load state", e);
            }
        }
    }

    function initUI() {
        const tbody = document.querySelector("#servoTable tbody");
        servos.forEach(s => {
            state[s.pin] = { 
                current: 90, 
                min: null, 
                mid: null,
                max: null, 
                sweeping: false,
                sweepDirection: 1 // 1 for up, -1 for down
            };
        });

        loadState();

        servos.forEach(s => {
            const minDisp = state[s.pin].min !== null ? state[s.pin].min + "°" : "-";
            const midDisp = state[s.pin].mid !== null ? state[s.pin].mid + "°" : "-";
            const maxDisp = state[s.pin].max !== null ? state[s.pin].max + "°" : "-";
            const curDisp = state[s.pin].current + "°";

            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td><strong>${s.name}</strong></td>
                <td><span style="background:#444; padding:2px 6px; border-radius:4px;">Pin ${s.pin}</span></td>
                <td>
                    <input type="checkbox" class="sweep-checkbox" id="sweep_${s.pin}" onchange="toggleSweep(${s.pin})">
                </td>
                <td style="white-space: nowrap;">
                    <button class="btn-jog" onclick="jog(${s.pin}, -10)">-10°</button>
                    <button class="btn-jog" onclick="jog(${s.pin}, -1)">-1°</button>
                    <span class="angle-display" id="angle_${s.pin}">${curDisp}</span>
                    <button class="btn-jog" onclick="jog(${s.pin}, 1)">+1°</button>
                    <button class="btn-jog" onclick="jog(${s.pin}, 10)">+10°</button>
                    <button onclick="setAngle(${s.pin}, 90)" style="margin-left:10px;">Set 90°</button>
                </td>
                <td>
                    <button class="btn-capture" onclick="capture(${s.pin}, 'min')">Capture Min</button>
                    <br><input type="number" class="captured-val" id="val_min_${s.pin}" value="${state[s.pin].min ?? ''}" onchange="typed(${s.pin}, 'min', this.value)">
                </td>
                <td>
                    <button class="btn-capture" onclick="capture(${s.pin}, 'mid')">Capture Mid</button>
                    <button class="btn-capture" onclick="calcMid(${s.pin})" style="margin-top:5px; background-color: #17a2b8;">Auto Mid</button>
                    <br><input type="number" class="captured-val" id="val_mid_${s.pin}" value="${state[s.pin].mid ?? ''}" onchange="typed(${s.pin}, 'mid', this.value)">
                </td>
                <td>
                    <button class="btn-capture" onclick="capture(${s.pin}, 'max')">Capture Max</button>
                    <br><input type="number" class="captured-val" id="val_max_${s.pin}" value="${state[s.pin].max ?? ''}" onchange="typed(${s.pin}, 'max', this.value)">
                </td>
            `;
            tbody.appendChild(tr);
        });

        startSweepLoop();
    }

    async function sendWiFi(pin, angle, ms = 0) {
        const ip = document.getElementById("ipAddress").value;
        const url = `${location.protocol === "https:" ? "https:" : "http:"}//${ip}/servo?p${pin}=${angle}` + (ms ? `&ms=${ms}` : "");
        try {
            await fetch(url, { method: 'GET', mode: 'no-cors' });
        } catch (e) {
            console.error("Network error sending command to ESP32", e);
        }
    }

    let isRequestPending = false;
    async function sendWiFiBatch(updates) {
        if (isRequestPending) return; // Prevent choking the ESP32
        const ip = document.getElementById("ipAddress").value;
        let query = "";
        for (const pin in updates) {
            query += `p${pin}=${updates[pin]}&`;
        }
        if (!query) return;

        const url = `${location.protocol === "https:" ? "https:" : "http:"}//${ip}/servo?${query}`;
        isRequestPending = true;
        try {
            await fetch(url, { method: 'GET', mode: 'no-cors' });
        } catch (e) {
            console.error("Network error sending batch command to ESP32", e);
        }
        isRequestPending = false;
    }

    document.getElementById("btnTest").addEventListener("click", async () => {
        const ip = document.getElementById("ipAddress").value;
        const status = document.getElementById("status");
        status.innerText = "Testing...";
        status.style.color = "yellow";
        try {
            await fetch(`${location.protocol === "https:" ? "https:" : "http:"}//${ip}/servo?p7=${state[7].current}`, { method: 'GET', mode: 'no-cors' });
            status.innerText = "Connected! ✅";
            status.style.color = "#00ffaa";
        } catch (e) {
            status.innerText = "Failed ❌";
            status.style.color = "red";
        }
    });

    function setAngle(pin, angle) {
        if (angle < -90) angle = -90;
        if (angle > 180) angle = 180;
        const jump = Math.abs(angle - state[pin].current);  // a big jump glides (on the robot)

        state[pin].current = angle;
        document.getElementById(`angle_${pin}`).innerText = Math.round(angle) + "°";
        saveState();
        
        // Highlight active row
        document.querySelectorAll("tbody tr").forEach(tr => tr.classList.remove("row-active"));
        document.getElementById(`angle_${pin}`).parentElement.parentElement.classList.add("row-active");
        
        sendWiFi(pin, angle, jump > 4 ? Math.min(600, Math.round(jump * 6)) : 0);
    }

    function jog(pin, amount) {
        setAngle(pin, state[pin].current + amount);
    }

    function capture(pin, type) {
        const val = state[pin].current;
        state[pin][type] = val;
        setVal(pin, type, val);
    }

    // a value changed on the page (typed or captured): shown in orange until it's saved on the robot
    let robotVals = {};
    function setVal(pin, type, val) {
        state[pin][type] = val;
        const el = document.getElementById(`val_${type}_${pin}`);
        if (el) {
            el.value = val;
            el.classList.toggle('dirty', robotVals[pin] === undefined || robotVals[pin][type] !== val);
        }
        saveState();
    }
    function typed(pin, type, v) {
        const n = Math.round(parseFloat(v));
        if (isNaN(n)) return;
        setVal(pin, type, Math.max(-90, Math.min(200, n)));
    }

    function calcMid(pin) {
        const sv = servos.find(x => x.pin === pin);
        if (sv && /^[LR][34]$/.test(sv.role)) {  // a knee's mid is not halfway: min (foot up) is far, max (tucked) is near
            alert("Knees: set Mid by hand - the foot pointing straight down - then press Capture Mid.");
            return;
        }
        if (state[pin].min !== null && state[pin].max !== null) {
            const mid = Math.round((state[pin].min + state[pin].max) / 2);
            state[pin].mid = mid;
            setVal(pin, 'mid', mid);
            setAngle(pin, mid);
        } else {
            alert("Please capture both Min and Max first!");
        }
    }

    function toggleSweep(pin) {
        const cb = document.getElementById(`sweep_${pin}`);
        if (cb.checked) {
            if (state[pin].min === null || state[pin].max === null) {
                alert("Please capture both Min and Max before sweeping!");
                cb.checked = false;
                return;
            }
            state[pin].sweeping = true;
        } else {
            state[pin].sweeping = false;
        }
    }

    document.getElementById("btnSweepAll").addEventListener("click", () => {
        let allSweeping = true;
        servos.forEach(s => {
            if (!document.getElementById(`sweep_${s.pin}`).checked) allSweeping = false;
        });

        // Toggle all
        servos.forEach(s => {
            if (state[s.pin].min !== null && state[s.pin].max !== null) {
                const cb = document.getElementById(`sweep_${s.pin}`);
                cb.checked = !allSweeping;
                toggleSweep(s.pin);
            }
        });
    });

    // Speed slider logic
    document.getElementById("sweepSpeed").addEventListener("input", (e) => {
        document.getElementById("speedDisplay").innerText = e.target.value;
        startSweepLoop(); // Restart loop with new interval
    });

    function startSweepLoop() {
        if (sweepInterval) clearInterval(sweepInterval);
        
        const speedMs = parseInt(document.getElementById("sweepSpeed").value);
        
        sweepInterval = setInterval(() => {
            const batchUpdates = {};
            let needsUpdate = false;

            servos.forEach(s => {
                const p = s.pin;
                if (state[p].sweeping) {
                    let angle = state[p].current;
                    angle += state[p].sweepDirection; // Move 1 degree
                    
                    // (min above max on a reversed servo: it jumped end to end every tick)
                    const lo = Math.min(state[p].min, state[p].max), hi = Math.max(state[p].min, state[p].max);
                    if (angle >= hi) {
                        angle = hi;
                        state[p].sweepDirection = -1;
                    } else if (angle <= lo) {
                        angle = lo;
                        state[p].sweepDirection = 1;
                    }
                    
                    state[p].current = angle;
                    document.getElementById(`angle_${p}`).innerText = Math.round(angle) + "°";
                    batchUpdates[p] = angle;
                    needsUpdate = true;
                }
            });

            if (needsUpdate) {
                saveState();
                sendWiFiBatch(batchUpdates);
            }
        }, speedMs);
    }

    // every servo moves to its min / mid / max together: one request, and the robot glides there itself
    // (~0.6 s, eased, a step every loop) - 12 steps from the page juddered on the long-travel legs
    async function setAll(type) {
        let query = "";
        servos.forEach(s => {
            const v = state[s.pin][type];
            if (v === null || v === undefined) return;
            state[s.pin].current = v;
            document.getElementById(`angle_${s.pin}`).innerText = Math.round(v) + "°";
            query += `p${s.pin}=${v}&`;
        });
        if (!query) return;
        try { await fetch(robotUrl("/servo?" + query + "ms=600"), { mode: "no-cors" }); } catch (e) { /* offline */ }
        saveState();
    }

    document.getElementById("btnExport").addEventListener("click", () => {
        let text = "SERVO LIMITS EXPORT:\n\n";
        servos.forEach(s => {
            const min = state[s.pin].min !== null ? state[s.pin].min : "TBD";
            const mid = state[s.pin].mid !== null ? state[s.pin].mid : "TBD";
            const max = state[s.pin].max !== null ? state[s.pin].max : "TBD";
            text += `${s.name} (Pin ${s.pin}): Min=${min}, Mid=${mid}, Max=${max}\n`;
        });
        
        alert("Copy this to the AI Assistant:\n\n" + text);
        console.log(text);
    });

    // ---- On the robot: its address, its saved values, and saving back to it ----
    const ipBox = document.getElementById("ipAddress");
    if (!ipBox.value) ipBox.value = location.host || "";
    const robotUrl = (p) => `${location.protocol === "https:" ? "https:" : "http:"}//${ipBox.value}${p}`;
    function showRobot(j) {
        if (!j || !j.servos) return;
        robotVals = {};
        j.servos.forEach(v => {
            if (!state[v.pin]) return;
            robotVals[v.pin] = { min: v.min, mid: v.mid, max: v.max };
            ["min", "mid", "max"].forEach(t => setVal(v.pin, t, v[t]));
        });
    }
    async function loadRobot() {
        const status = document.getElementById("status");
        try {
            const j = await (await fetch(robotUrl("/servoCal"))).json();
            showRobot(j);
            status.innerText = "Loaded the robot's calibration ✅";
            status.style.color = "#00ffaa";
        } catch (e) {
            status.innerText = "Couldn't read the robot's calibration";
            status.style.color = "red";
        }
    }
    let saving = false;
    document.getElementById("btnSaveRobot").addEventListener("click", async () => {
        if (saving) return;  // (one save at a time: a click went to the robot five times)
        const status = document.getElementById("status");
        let changed = 0;
        servos.forEach(s => ["min", "mid", "max"].forEach(t => {
            if (robotVals[s.pin] && state[s.pin][t] !== null && robotVals[s.pin][t] !== state[s.pin][t]) changed++;
        }));
        if (!changed) {
            status.innerText = "Nothing changed: type a value or press Capture (jogging alone only moves the servo)";
            status.style.color = "#ffaa00";
            return;
        }
        const parts = [];
        const missing = [];
        servos.forEach(s => {
            const v = state[s.pin];
            if (v.min === null || v.mid === null || v.max === null) missing.push(s.name);
            else parts.push(`p${s.pin}=${Math.round(v.min)},${Math.round(v.mid)},${Math.round(v.max)}`);
        });
        if (missing.length && !confirm("These have no min / mid / max yet and keep the robot's values:\n" + missing.join("\n") + "\n\nSave the rest?")) return;
        if (!parts.length) return;
        status.innerText = "Saving...";
        status.style.color = "yellow";
        saving = true;
        try {
            const j = await (await fetch(robotUrl("/servoCal?" + parts.join("&")))).json();
            showRobot(j);
            status.innerText = j.saved ? `Saved: ${changed} value${changed > 1 ? "s" : ""} changed on the robot ✅ (stand = the mids; the head uses its new limits)` : "Sent, but the robot couldn't save it ❌";
            status.style.color = j.saved ? "#00ffaa" : "red";
        } catch (e) {
            status.innerText = "Save failed ❌";
            status.style.color = "red";
        }
        saving = false;
    });
    document.getElementById("btnResetRobot").addEventListener("click", async () => {
        if (!confirm("Put every servo back to the built-in calibration?")) return;
        try { showRobot(await (await fetch(robotUrl("/servoCal?reset=1"))).json()); } catch (e) { /* offline */ }
        document.getElementById("status").innerText = "Back to the built-in values ✅";
    });

    // the servo map first: which channel each servo is really on
    (async () => {
        try {
            const m = await (await fetch(robotUrl("/servomap?json=1"))).json();
            m.roles.forEach(r => { const s = servos.find(x => x.role === r.id); if (s) s.pin = r.ch; });
        } catch (e) { /* offline: the reference wiring */ }
        initUI();
        loadRobot();
    })();
</script>

</body>
</html>
